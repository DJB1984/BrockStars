<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrockStars Sprites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: sticky control bar, then one section per character with a wrapping grid of live animation tiles. */
  :root {
    --bg: #eef0f5; --surface: #ffffff; --ink: #181425; --muted: #5a6988; --line: #c0cbdc; --accent: #a22633;
    --chip: #e2e6ef;
    --display: "Silkscreen", "Courier New", monospace;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141220; --surface: #222740; --ink: #e8ebf3; --muted: #8b9bb4; --line: #3a4466; --accent: #f6757a;
      --chip: #2d3352; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141220; --surface: #222740; --ink: #e8ebf3; --muted: #8b9bb4; --line: #3a4466; --accent: #f6757a;
    --chip: #2d3352; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

  header.top { padding-block: 32px 20px; display: grid; gap: 6px; }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 400 clamp(26px, 5vw, 40px)/1.1 var(--display); margin: 0; text-wrap: balance; }
  .summary { color: var(--muted); font-variant-numeric: tabular-nums; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
         border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding-block: 10px; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > span { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--body);
                padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--body);
         padding: 5px 12px; border-radius: 8px; cursor: pointer; }
  .check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  button:focus-visible, input:focus-visible, canvas:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav.chars { display: flex; flex-wrap: wrap; gap: 6px; }
  nav.chars a { font: 500 13px var(--mono); color: var(--ink); text-decoration: none; background: var(--chip);
                padding: 3px 9px; border-radius: 999px; }

  main { display: grid; gap: 40px; padding-block: 28px 48px; }
  section.char { display: grid; gap: 16px; scroll-margin-top: 80px; }
  .char-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .char-head h2 { font: 400 24px/1.2 var(--display); margin: 0; }
  .char-head .meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .swatches { display: flex; flex-wrap: wrap; gap: 3px; }
  .swatches i { width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .2);
                display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--tile)), 1fr)); gap: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
          display: grid; gap: 10px; align-content: start; min-width: 0; }
  .stage { display: grid; place-items: center; border-radius: 8px; overflow: hidden; cursor: pointer; }
  .stage canvas { image-rendering: pixelated; display: block; max-width: 100%; height: auto; }
  .tile-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .tile-head strong { font-weight: 600; }
  .badge { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px;
           border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .badge.once { color: var(--accent); }
  .facts { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex;
           flex-wrap: wrap; gap: 2px 12px; }
  .facts code { color: var(--ink); flex-basis: 100%; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px 4px; }
  .strip button { border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 2px;
                  justify-items: center; font: 10px var(--mono); color: var(--muted); }
  .strip canvas { image-rendering: pixelated; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line);
                  outline: 2px solid transparent; outline-offset: 1px; }
  .strip button.on canvas { outline-color: var(--accent); }
  .strip button.on { color: var(--ink); }

  .tilegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 12px; }
  .tilecard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
              display: grid; gap: 6px; align-content: start; min-width: 0; }
  .tilecard canvas, .mapview canvas { image-rendering: pixelated; display: block; max-width: 100%; height: auto;
                                      border-radius: 6px; }
  .tilecard .facts code { flex-basis: auto; }
  .mapview { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
             display: grid; gap: 8px; justify-items: start; overflow-x: auto; }

  .levelview { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
               display: grid; gap: 10px; min-width: 0; }
  .levelview .whole { overflow-x: auto; }
  .levelview img { image-rendering: pixelated; display: block; border-radius: 6px; }
  .levelview .screens { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .levelview figure { margin: 0; display: grid; gap: 4px; flex: none; font: 12px var(--mono); color: var(--muted); }

  footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; display: grid; gap: 8px; }
  footer pre { font: 12px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line);
               border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0; color: var(--ink); }
</style>
</head>
<body>

<header class="top wrap">
  <div class="eyebrow">Sprite gallery</div>
  <h1 id="game"></h1>
  <div class="summary" id="summary"></div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="group"><span>Zoom</span><div class="seg" id="zoom"></div></div>
    <div class="group"><span>Stage</span><div class="seg" id="stagebg"></div></div>
    <button class="btn" id="playall" type="button">Pause all</button>
    <label class="check"><input type="checkbox" id="repeat" checked> Repeat one-shots</label>
    <label class="check" title="Body box (yellow), hurtboxes (green), hitboxes on active frames (red)"><input type="checkbox" id="boxes"> Hit boxes</label>
    <nav class="chars" id="chars" aria-label="Characters"></nav>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer class="wrap">
  <div>Click a stage to pause that animation. Click a frame below it to inspect that frame. Animations marked
    <b>once</b> play a single time in the game. Here they repeat after a short pause.</div>
  <pre id="usage"></pre>
</footer>

const ZOOMS = [2, 3, 4, 6];
const STAGES = { Checker: 'check', Night: '#262b44', Sky: '#9fd0f0', Grass: '#63c74d' };
const REPEAT_PAUSE_MS = 500;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const prefs = (() => { try { return JSON.parse(localStorage.getItem('pf-gallery') || '{}'); } catch { return {}; } })();
const opts = { zoom: ZOOMS.includes(prefs.zoom) ? prefs.zoom : 4, stage: prefs.stage in STAGES ? prefs.stage : 'Checker' };
const save = () => { try { localStorage.setItem('pf-gallery', JSON.stringify(opts)); } catch {} };
const $ = (id) => document.getElementById(id);
const tiles = [];

function paint(ctx, tile, i, z) {
  const s = tile.sprite, f = tile.anim.frames[i], bg = STAGES[opts.stage];
  const w = s.w * z, h = s.h * z;
  if (ctx.canvas.width !== w) { ctx.canvas.width = w; ctx.canvas.height = h; }
  ctx.imageSmoothingEnabled = false;
  if (bg === 'check') {
    for (let y = 0; y < s.h; y += 2) for (let x = 0; x < s.w; x += 2) {
      ctx.fillStyle = ((x + y) / 2) % 2 ? '#d9dde6' : '#eef0f5';
      ctx.fillRect(x * z, y * z, 2 * z, 2 * z);
    }
  } else { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(s.img, f.x, f.y, s.w, s.h, 0, 0, w, h);
}

function drawBoxes(ctx, tile, i, z) {
  const f = tile.anim.frames[i], [bx, by, bw, bh] = tile.sprite.body;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = '#fac828';
  ctx.strokeRect(bx * z + 0.5, by * z + 0.5, bw * z - 1, bh * z - 1);
  ctx.setLineDash([]);
  ctx.lineWidth = 2;
  for (const [kind, color] of [['hurt', '#28c85a'], ['hit', '#f0283c']]) {
    ctx.strokeStyle = color;
    for (const [x, y, w, h] of f[kind]) ctx.strokeRect(x * z + 1, y * z + 1, w * z - 2, h * z - 2);
  }
}

function drawTile(t) {
  paint(t.ctx, t, t.frame, opts.zoom);
  if ($('boxes').checked) drawBoxes(t.ctx, t, t.frame, opts.zoom);
  t.strip.forEach((b, i) => b.classList.toggle('on', i === t.frame));
}

function buildTile(sprite, anim) {
  const el = document.createElement('article');
  el.className = 'tile';
  const total = anim.frames.reduce((a, f) => a + f.d, 0);
  el.innerHTML = `
    <div class="stage" role="button" tabindex="0" aria-label="Pause or play ${anim.name}"><canvas></canvas></div>
    <div class="tile-head"><strong>${anim.name}</strong>
      <span class="badge ${anim.loop ? '' : 'once'}">${anim.loop ? 'loops' : 'once'}</span></div>
    <div class="facts"><span>${anim.frames.length} frames</span><span>${anim.fps} fps</span><span>${total} ms</span>
      <code>${sprite.name}_${anim.name}</code></div>
    <div class="strip"></div>`;
  const t = { sprite, anim, el, frame: 0, acc: 0, playing: !reduceMotion, ctx: el.querySelector('canvas').getContext('2d'), strip: [] };
  const strip = el.querySelector('.strip');
  anim.frames.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.title = `Frame ${i + 1}: ${f.d} ms`;
    const c = document.createElement('canvas');
    b.append(c, document.createTextNode(f.d));
    b.onclick = () => { t.playing = false; t.frame = i; t.acc = 0; drawTile(t); };
    strip.append(b);
    t.strip.push(b);
  });
  const toggle = () => { t.playing = !t.playing; if (t.playing && t.frame === anim.frames.length - 1 && !anim.loop) t.frame = 0; };
  const stage = el.querySelector('.stage');
  stage.onclick = toggle;
  stage.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  tiles.push(t);
  return el;
}

// Tilesets: each tile repeated 3x3 (so seams show), then the sample map from sprite.json.
// Animated tiles: ts.anims[i] = [[slot, ms], ...] on one shared clock, as in the game.
const tileViews = [];
let tileClock = 0, tilesPlaying = !reduceMotion, tileSig = '';
function tileSrc(ts, i) {
  return [(i % ts.cols) * (ts.w + ts.spacing), Math.floor(i / ts.cols) * (ts.h + ts.spacing)];
}
function slotAt(ts, i) {
  const a = ts.anims?.[i];
  if (!a) return i;
  let t = tileClock % a.reduce((sum, [, ms]) => sum + ms, 0);
  for (const [slot, ms] of a) { if (t < ms) return slot; t -= ms; }
  return i;
}
function tickTiles(dt) {
  if (!tilesPlaying) return;
  tileClock += dt;
  const sig = DATA.tilesets.map((ts) => Object.keys(ts.anims ?? {}).map((i) => slotAt(ts, i)).join(',')).join('|');
  if (sig !== tileSig) { tileSig = sig; paintTileViews(); }
}
function paintTileViews() {
  const z = Math.max(1, Math.round(opts.zoom / 2));
  for (const v of tileViews) {
    const { ts, ctx } = v;
    const rep = ts.kind && ts.kind !== 'tileset' ? 1 : 3;   // icons and glyphs don't repeat edge to edge
    const cols = v.rows ? Math.max(...v.rows.map((r) => r.length)) : rep, rows = v.rows ? v.rows.length : rep;
    ctx.canvas.width = cols * ts.w * z; ctx.canvas.height = rows * ts.h * z;
    ctx.imageSmoothingEnabled = false;
    const bg = STAGES[opts.stage];
    ctx.fillStyle = bg === 'check' ? '#d9dde6' : bg;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = v.rows ? v.rows[y][x] ?? -1 : v.index;
      if (i < 0) continue;
      const [sx, sy] = tileSrc(ts, slotAt(ts, i));
      ctx.drawImage(ts.img, sx, sy, ts.w, ts.h, x * ts.w * z, y * ts.h * z, ts.w * z, ts.h * z);
    }
  }
}
function buildTileset(ts) {
  const sec = document.createElement('section');
  sec.className = 'char';
  sec.id = ts.name;
  sec.innerHTML = `<div class="char-head"><h2>${ts.name}</h2>
    <span class="meta">${ts.kind ?? 'tileset'} · ${ts.w}×${ts.h} px ${ts.kind === 'font' ? 'cells' : ts.kind === 'icons' ? 'icons' : 'tiles'} · ${ts.tiles.length} ${ts.kind === 'font' ? 'glyphs' : ts.kind === 'icons' ? 'icons' : 'tiles'} · ${ts.palette.length} colors</span>
    <div class="swatches">${ts.palette.map(([k, hex, label]) => `<i style="background:${hex}" title="${k}  ${label}"></i>`).join('')}</div></div>
    <div class="tilegrid"></div>`;
  const grid = sec.querySelector('.tilegrid');
  ts.tiles.forEach((t, i) => {
    const card = document.createElement('article');
    card.className = 'tilecard';
    const frames = ts.anims?.[i];
    const props = [frames ? `${frames.length}-frame anim` : '',
                   ...Object.entries(t.props).map(([k, v]) => (v === true ? k : `${k}=${v}`))].filter(Boolean).join(' ');
    card.innerHTML = `<canvas></canvas><div class="tile-head"><strong>${t.name}</strong><span class="badge">#${i}</span></div>
      ${props ? `<div class="facts"><code>${props}</code></div>` : ''}`;
    card.title = ts.kind && ts.kind !== 'tileset' ? `${t.name}` : `Tile ${i}: ${t.name}, repeated 3×3`;
    tileViews.push({ ts, index: i, ctx: card.querySelector('canvas').getContext('2d') });
    grid.append(card);
  });
  if (ts.sample.length) {
    const m = document.createElement('div');
    m.className = 'mapview';
    m.innerHTML = `<div class="tile-head"><strong>Sample map</strong><span class="badge">sprite.json "sample"</span></div><canvas></canvas>`;
    tileViews.push({ ts, rows: ts.sample, ctx: m.querySelector('canvas').getContext('2d') });
    sec.append(m);
  }
  return sec;
}

function paintStrips() {
  for (const t of tiles) t.strip.forEach((b, i) => paint(b.querySelector('canvas').getContext('2d'), t, i, t.sprite.w > 40 ? 1 : 2));
}

function layout() {
  const maxW = Math.max(...DATA.sprites.map((s) => s.w));
  document.documentElement.style.setProperty('--tile', `${Math.max(260, maxW * opts.zoom + 26)}px`);
  tiles.forEach(drawTile);
}

function segmented(id, values, current, onPick) {
  const seg = $(id);
  seg.innerHTML = '';
  for (const [label, value] of values) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(value === current()));
    b.onclick = () => { onPick(value); [...seg.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b))); save(); };
    seg.append(b);
  }
}

// a level: the whole thing (2x when it fits), then each screen as the player sees it, HUD and all
function buildLevel(lv) {
  const sec = document.createElement('section');
  sec.className = 'char';
  sec.id = lv.name;
  const z = lv.w * 2 <= 1146 ? 2 : 1;
  sec.innerHTML = `<div class="char-head"><h2>${lv.name}</h2>
    <span class="meta">level · ${lv.view} · ${lv.cells[0]}×${lv.cells[1]} tiles (${lv.w}×${lv.h} px) · ${lv.objects} objects · ${lv.screens.length} screens</span></div>
    <div class="levelview"><div class="whole"><img src="${lv.image}" width="${lv.w * z}" height="${lv.h * z}" alt="The whole ${lv.name} level"></div>
      <div class="tile-head"><strong>Screens</strong><span class="badge">what the camera shows</span></div>
      <div class="screens">${lv.screens.map((src, i) => `<figure><img src="${src}" alt="${lv.name} screen ${i + 1}">Screen ${i + 1}</figure>`).join('')}</div></div>`;
  return sec;
}

async function init() {
  const sprites = DATA.sprites, tilesets = DATA.tilesets ?? [], levels = DATA.levels ?? [];
  const animCount = sprites.reduce((a, s) => a + s.anims.length, 0);
  const frameCount = sprites.reduce((a, s) => a + s.anims.reduce((b, an) => b + an.frames.length, 0), 0);
  const terrains = tilesets.filter((t) => !t.kind || t.kind === 'tileset'), uiSets = tilesets.filter((t) => t.kind && t.kind !== 'tileset');
  const tileCount = terrains.reduce((a, t) => a + t.tiles.length, 0);
  $('game').textContent = DATA.game;
  const nProps = sprites.filter((s) => s.kind === 'prop').length, nFx = sprites.filter((s) => s.kind === 'fx').length;
  const nChars = sprites.length - nProps - nFx;
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  $('summary').textContent = (levels.length ? `${plural(levels.length, 'level')} · ` : '') +
    `${plural(nChars, 'character')} · ` + (nProps ? `${plural(nProps, 'prop')} · ` : '') + (nFx ? `${plural(nFx, 'effect')} · ` : '') +
    `${animCount} animations · ${frameCount} frames · ` +
    (terrains.length ? `${plural(terrains.length, 'tileset')} · ${tileCount} tiles · ` : '') +
    (uiSets.length ? `${plural(uiSets.length, 'UI set')} · ` : '') +
    `exported ${DATA.generated}`;

  await Promise.all([...sprites, ...tilesets].map((s) => { s.img = new Image(); s.img.src = s.sheet; return s.img.decode(); }));

  for (const lv of levels) $('main').append(buildLevel(lv));
  for (const s of sprites) {
    const sec = document.createElement('section');
    sec.className = 'char';
    sec.id = s.name;
    sec.innerHTML = `<div class="char-head"><h2>${s.name}</h2>
      <span class="meta">${s.variantOf ? `variant of <a href="#${s.variantOf}">${s.variantOf}</a> · ` : ''}${s.kind === 'fx' ? 'effect · plays once · ' : ''}${s.prop ? `prop · ${s.prop.layer}${s.prop.solid ? ' · solid' : ''}${s.prop.scroll !== 1 ? ` · scroll ${s.prop.scroll}` : ''} · ` : ''}${s.class ? s.class + ' · ' : ''}${s.w}×${s.h} px canvas · ${s.prop ? 'footprint' : 'body'} ${s.body[2]}×${s.body[3]} · ${s.palette.length} colors · ${s.anims.length} ${s.prop ? 'states' : 'animations'}</span>
      <div class="swatches">${s.palette.map(([k, hex, label]) => `<i style="background:${hex}" title="${k}  ${label}"></i>`).join('')}</div></div>
      <div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    s.anims.forEach((a) => grid.append(buildTile(s, a)));
    $('main').append(sec);
  }
  for (const ts of tilesets) $('main').append(buildTileset(ts));
  if (levels.length + sprites.length + tilesets.length > 1) {
    for (const s of [...levels, ...sprites, ...tilesets]) {
      const a = document.createElement('a');
      a.href = `#${s.name}`;
      a.textContent = s.name;
      $('chars').append(a);
    }
  }

  segmented('zoom', ZOOMS.map((z) => [`${z}×`, z]), () => opts.zoom, (z) => { opts.zoom = z; layout(); paintTileViews(); });
  segmented('stagebg', Object.keys(STAGES).map((k) => [k, k]), () => opts.stage, (k) => { opts.stage = k; paintStrips(); layout(); paintTileViews(); });
  $('playall').onclick = () => {
    const anyPlaying = tiles.some((t) => t.playing) || tilesPlaying;
    tiles.forEach((t) => { t.playing = !anyPlaying; });
    tilesPlaying = !anyPlaying;
    $('playall').textContent = anyPlaying ? 'Play all' : 'Pause all';
  };
  if (reduceMotion) $('playall').textContent = 'Play all';
  $('boxes').onchange = () => tiles.forEach(drawTile);

  const chars = sprites.filter((s) => s.kind === 'sprite' || !s.kind), props = sprites.filter((s) => s.kind === 'prop');
  const fx = sprites.filter((s) => s.kind === 'fx');
  const first = chars[0];
  $('usage').textContent = [
    `// Phaser 3, with pixelArt: true. Files: export/<name>.png + export/<name>.json + export/pixelforge.js`,
    ...(first ? [
      `import { loadPixelforge, createPixelforgeAnims, enablePixelforgeHits } from './export/pixelforge.js';`,
      `preload() { ${chars.map((s) => `loadPixelforge(this, '${s.name}');`).join(' ')} }`,
      `create()  { ${chars.map((s) => `createPixelforgeAnims(this, '${s.name}');`).join(' ')}`,
      `            const hero = this.add.sprite(200, 150, '${first.name}').play('${first.name}_${first.anims[0].name}');`,
      `            enablePixelforgeHits(this, hero, () => enemies, (enemy) => enemy.takeDamage(1)); }`] : []),
    ...(props.length ? [
      `// props: states are animations; solid props get a static body from the footprint`,
      `import { addPixelforgeProp } from './export/pixelforge.js';`,
      `preload() { ${props.map((s) => `loadPixelforge(this, '${s.name}');`).join(' ')} }`,
      `create()  { ${props.map((s, i) => `addPixelforgeProp(this, ${40 + i * 60}, 120, '${s.name}');`).join(' ')} }`] : []),
    ...(fx.length ? [
      `// effects play once where you spawn them, then remove themselves`,
      `import { spawnPixelforgeFx } from './export/pixelforge.js';`,
      `preload() { ${fx.map((s) => `loadPixelforge(this, '${s.name}');`).join(' ')} }`,
      `onHit(target) { spawnPixelforgeFx(this, target.x, target.y - 12, '${fx[0].name}'); }`] : []),
    ...tilesets.filter((t) => t.kind === 'icons').flatMap((t) => [
      `// icons ${t.name}: one image per name; nine-slice panels stretch to any size`,
      `import { loadPixelforgeIcons, addPixelforgePanel } from './export/pixelforge.js';`,
      `preload() { loadPixelforgeIcons(this, '${t.name}'); }`,
      `create()  { this.add.image(20, 20, '${t.name}', '${t.tiles[0]?.name ?? 'icon'}'); }`]),
    ...tilesets.filter((t) => t.kind === 'font').flatMap((t) => [
      `// font ${t.name}`,
      `import { loadPixelforgeFont } from './export/pixelforge.js';`,
      `preload() { loadPixelforgeFont(this, '${t.name}'); }`,
      `create()  { this.add.bitmapText(8, 8, '${t.name}', 'HELLO'); }`]),
    ...tilesets.filter((t) => !t.kind || t.kind === 'tileset').flatMap((t) => [
      `// tileset ${t.name}: tile index = position in sprite.json "tiles"`,
      `import { loadPixelforgeTiles, pixelforgeTilemap } from './export/pixelforge.js';`,
      `preload() { loadPixelforgeTiles(this, '${t.name}'); }`,
      `create()  { const { map, layer } = pixelforgeTilemap(this, '${t.name}');   // its sample map, collides set`,
      `            this.physics.add.collider(hero, layer); }`]),
  ].join('\n');

  paintStrips();
  layout();
  paintTileViews();
  let last = performance.now();
  const tick = (now) => {
    const dt = now - last;
    last = now;
    tickTiles(dt);
    for (const t of tiles) {
      if (!t.playing) continue;
      const n = t.anim.frames.length;
      const hold = (i) => t.anim.frames[i].d + (i === n - 1 && !t.anim.loop ? REPEAT_PAUSE_MS : 0);
      t.acc += dt;
      let changed = false;
      while (t.acc >= hold(t.frame)) {
        t.acc -= hold(t.frame);
        if (t.frame === n - 1 && !t.anim.loop && !$('repeat').checked) { t.acc = 0; t.playing = false; break; }
        t.frame = (t.frame + 1) % n;
        changed = true;
      }
      if (changed) drawTile(t);
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
init();
</script>

</body>
</html>
